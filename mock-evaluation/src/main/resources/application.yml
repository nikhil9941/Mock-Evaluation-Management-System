server:
  port: 8082

spring:
  application:
    name: mock-evaluation

  datasource:
    url: jdbc:mysql://localhost:3306/mockeval?useSSL=false&serverTimezone=UTC
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
           issuer-uri: http://localhost:8081			



